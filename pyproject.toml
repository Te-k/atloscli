[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atloscli"
version = "0.1.0"
description = "Command line tool for Atlos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
atloscli = "atloscli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atloscli"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
